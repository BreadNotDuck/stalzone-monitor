name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-stalzone-monitor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ".,!.venv,!venv,!.git,!data,!__pycache__,!.pytest_cache,!deploy/remote.env,!.env"
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true
          strip_components: 0

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          PROXY_SUB_URL: ${{ secrets.PROXY_SUB_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ENV_FILE,PROXY_SUB_URL
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "$APP_DIR"

            if [ ! -f config.yaml ] && [ -f config.yaml.example ]; then
              cp config.yaml.example config.yaml
            fi

            if [ -n "${ENV_FILE:-}" ]; then
              printf '%s\n' "$ENV_FILE" > .env
            elif [ ! -f .env ]; then
              echo "ERROR: .env missing. Add GitHub secret ENV_FILE."
              exit 1
            fi

            # VPN subscription: отдельный секрет или уже внутри ENV_FILE
            if [ -n "${PROXY_SUB_URL:-}" ]; then
              sed -i '/^PROXY_SUB_URL=/d' .env || true
              printf 'PROXY_SUB_URL=%s\n' "$PROXY_SUB_URL" >> .env
            fi

            # Гарантируем, что бот ходит в Telegram через mihomo
            sed -i '/^HTTPS_PROXY=/d;/^HTTP_PROXY=/d;/^NO_PROXY=/d' .env || true
            printf '%s\n' \
              'HTTPS_PROXY=http://proxy:7890' \
              'HTTP_PROXY=http://proxy:7890' \
              'NO_PROXY=localhost,127.0.0.1,proxy' >> .env

            if ! grep -q '^PROXY_SUB_URL=.\+' .env; then
              echo "::error::PROXY_SUB_URL не задан. Добавь GitHub secret PROXY_SUB_URL (ссылка VPN-подписки)."
              exit 1
            fi

            mkdir -p data
            chmod +x deploy/healthcheck.sh deploy/up.sh deploy/mihomo/entrypoint.sh || true

            if ! command -v docker >/dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            docker compose pull proxy || true
            docker compose up -d --build
            sleep 8
            bash deploy/healthcheck.sh "$APP_DIR"
