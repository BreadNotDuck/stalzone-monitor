name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-stalzone-monitor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ".,!.venv,!venv,!.git,!data,!__pycache__,!.pytest_cache,!deploy/remote.env,!.env,!deploy/mihomo/runtime,!config.yaml"
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true
          strip_components: 0

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "$APP_DIR"

            if [ ! -f config.yaml ] && [ -f config.yaml.example ]; then
              cp config.yaml.example config.yaml
            fi

            if [ -n "${ENV_FILE:-}" ]; then
              printf '%s\n' "$ENV_FILE" > .env
            elif [ ! -f .env ]; then
              echo "::error::.env missing. Add GitHub secret ENV_FILE."
              exit 1
            fi

            # На зарубежном VPS прокси обычно не нужен — убираем, если вдруг остался от старого сервера
            sed -i '/^HTTPS_PROXY=/d;/^HTTP_PROXY=/d;/^NO_PROXY=/d;/^PROXY_SUB_URL=/d' .env || true

            mkdir -p data
            sed -i 's/\r$//' deploy/healthcheck.sh || true
            chmod +x deploy/healthcheck.sh || true

            if ! command -v docker >/dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            docker compose up -d --build --force-recreate
            sleep 5
            docker compose ps -a || true
            docker compose logs --tail 80 || true
            bash deploy/healthcheck.sh "$APP_DIR"
