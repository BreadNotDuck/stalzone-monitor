name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-stalzone-monitor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mihomo config from subscription
        env:
          PROXY_SUB_URL: ${{ secrets.PROXY_SUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PROXY_SUB_URL:-}" ]; then
            echo "::error::GitHub secret PROXY_SUB_URL пустой"
            exit 1
          fi
          python3 deploy/mihomo/build_config.py \
            --url "$PROXY_SUB_URL" \
            --out deploy/mihomo/runtime/config.yaml
          sed -i 's/\r$//' deploy/healthcheck.sh deploy/mihomo/build_config.py || true
          ls -la deploy/mihomo/runtime

      - name: Upload project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ".,!.venv,!venv,!.git,!data,!__pycache__,!.pytest_cache,!deploy/remote.env,!.env"
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true
          strip_components: 0

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "$APP_DIR"

            if [ ! -f config.yaml ] && [ -f config.yaml.example ]; then
              cp config.yaml.example config.yaml
            fi

            if [ -n "${ENV_FILE:-}" ]; then
              printf '%s\n' "$ENV_FILE" > .env
            elif [ ! -f .env ]; then
              echo "::error::.env missing. Add GitHub secret ENV_FILE."
              exit 1
            fi

            sed -i '/^HTTPS_PROXY=/d;/^HTTP_PROXY=/d;/^NO_PROXY=/d' .env || true
            printf '%s\n' \
              'HTTPS_PROXY=http://proxy:7890' \
              'HTTP_PROXY=http://proxy:7890' \
              'NO_PROXY=localhost,127.0.0.1,proxy' >> .env

            if [ ! -f deploy/mihomo/runtime/config.yaml ]; then
              echo "::error::Нет deploy/mihomo/runtime/config.yaml — шаг сборки подписки не попал на VPS"
              ls -laR deploy/mihomo || true
              exit 1
            fi

            mkdir -p data
            sed -i 's/\r$//' deploy/healthcheck.sh || true
            chmod +x deploy/healthcheck.sh || true

            if ! command -v docker >/dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            docker compose pull proxy || true
            if ! docker compose up -d --build --force-recreate; then
              echo "::error::docker compose up failed"
              docker compose ps -a || true
              docker compose logs --tail 100 || true
              exit 1
            fi

            sleep 8
            docker compose ps -a || true
            docker compose logs --tail 100 proxy || true

            if ! bash deploy/healthcheck.sh "$APP_DIR"; then
              echo "::error::Healthcheck failed"
              docker compose logs --tail 150 || true
              exit 1
            fi
